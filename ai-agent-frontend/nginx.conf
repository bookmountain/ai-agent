server {
    listen       80;
    server_name  localhost;
    
    # Frontend static file root
    root   /usr/share/nginx/html;

    # Return index.html for all HTML routes to support Vue Router
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend service
    location ^~ /api/ {
        # Backend upstream
        proxy_pass https://www.codefather.cn/api/;
        
        # Forward request headers
        proxy_set_header Host www.codefather.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE (Server-Sent Events) settings
        proxy_set_header Connection ""; # Keep the connection open
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 600s;
        
        # Extra debugging headers
        proxy_intercept_errors off;
    }

    # Serve static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    # Error page handling
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
} 
