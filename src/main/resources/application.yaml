spring:
  application:
    name: ai-agent
  ai:
    openai:
      api-key: <YOUR_API_KEY_STARTS_WITH_sk->
      base-url: https://dashscope-intl.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen3.5-plus
      embedding:
        options:
          model: text-embedding-v4
    ollama:
      base-url: http://localhost:11434
      chat:
        model: gemma3:1b
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10
    mcp:
      client:
        sse:
          connections:
            server1:
              url: http://localhost:8127
  #        stdio:
  #          servers-configuration: classpath:mcp-servers.json
  datasource:
    url: jdbc:postgresql://<YOUR_ADDRESS>/postgres
    username: <YOUR_USERNAME>
    password: <YOUR_PASSWORD>
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.book.aiagent.controller
knife4j:
  enable: true
  setting:
    language: en
search-api:
  api-key: <YOUR_API_KEY_STARTS_WITH_sk->
